[project]
name = "fastapi-template"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "alembic",
    "sqlalchemy[asyncio]",
    "psycopg[binary,pool]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
